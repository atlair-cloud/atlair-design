<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlair Design</title>
    <meta name="description" content="Atlair's open-source Vue 3 design system. The documentation is coming soon." />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ffffff; color: #344256; font-family: ui-sans-serif, system-ui, sans-serif; }
      main { padding: 2rem; max-width: 32rem; }
      h1 { margin: 0 0 0.5rem; color: #243041; font-size: 1.75rem; }
      p { margin: 0; line-height: 1.6; }
      @media (prefers-color-scheme: dark) {
        body { background: #111315; color: #cdd2d8; }
        h1 { color: #eef0f2; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Atlair Design</h1>
      <p>Atlair's open-source Vue 3 design system. The documentation is coming soon.</p>
    </main>
  </body>
</html>
